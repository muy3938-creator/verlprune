defaults:
  - vopd
  - _self_

# Reproducible single-H20 preset for visual-token pruning experiments.
data:

  # Small deterministic batch used by the milestone acceptance run.
  train_max_samples: 16

  train_batch_size: 1

  max_prompt_length: 256

  max_response_length: 32

  filter_overlong_prompts: false

  shuffle: false

  return_multi_modal_inputs: true

  image_key: images

  dataloader_num_workers: 0

actor_rollout_ref:

  model:

    trust_remote_code: true

    use_remove_padding: true

    enable_gradient_checkpointing: true

    use_fused_kernels: false

    lora_rank: 8

    lora_alpha: 16

    target_modules: ".*language_model.layers.*(q_proj|k_proj|v_proj|o_proj|gate_proj|up_proj|down_proj)"

    vision_token_pruning:

      enabled: true

      keep_ratio: 0.5

      # Stage 2: each decode query retains 50% of the physically cached
      # visual subset, so the nominal final fraction is 25% of the original.
      selector: vision_pulse

      selector_kwargs:
        budget_mode: fixed
        temperature: 0.1
        capture_capacity: 64

      keep_ratio_schedule: {}

      # Stage 1: select from vision embeddings immediately before layer 0.
      prefill_keep_ratio: 0.5

      prefill_selector: embedding_norm

      prefill_selector_kwargs: {}

      prefill_prune_after_layer: -1

      prune_after_layer: 15

      layerwise_backend: flex

      pre_pruning_backend: flash

      selector_input: decode_query

  actor:

    ppo_mini_batch_size: 1

    ppo_micro_batch_size_per_gpu: 1

    ppo_epochs: 1

    use_dynamic_bsz: false

    ppo_max_token_len_per_gpu: 512

    use_torch_compile: false

    calculate_entropy: false

    fsdp_config:

      param_offload: false

      optimizer_offload: false

    optim:

      lr: 1.0e-5

      lr_warmup_steps: 0

    policy_loss:

      loss_mode: vopd

    self_distillation:

      full_logit_distillation: true

      distillation_topk: 32

      distillation_add_tail: true

      max_reprompt_len: 256

      is_clip: 2.0

      teacher_always_on: true

      teacher_model_source: current

      teacher_image_key: bbox_images

      fallback_to_policy_loss_on_missing_teacher: false

      alpha: 0.5

      include_environment_feedback: false

      dont_reprompt_on_self_success: true

  rollout:

    name: vllm

    load_format: safetensors

    layered_summon: true

    n: 1

    tensor_model_parallel_size: 1

    gpu_memory_utilization: 0.1

    enforce_eager: true

    free_cache_engine: true

    enable_prefix_caching: false

    max_num_batched_tokens: 512

    max_model_len: 512

    max_num_seqs: 4

    log_prob_micro_batch_size_per_gpu: 1

    response_length: 32

    calculate_log_probs: true

    agent:

      num_workers: 1

    engine_kwargs:

      vllm:

        kv_cache_memory_bytes: 134217728

  ref:

    log_prob_micro_batch_size_per_gpu: 1

    fsdp_config:

      param_offload: false

critic:

  enable: false

reward_model:

  enable: false

  use_reward_loop: false

custom_reward_function:

  path: null

algorithm:

  adv_estimator: grpo

  norm_adv_by_std_in_grpo: false

  use_kl_in_reward: false

  rollout_correction:

    rollout_is: token

    rollout_is_threshold: 2.0

trainer:

  balance_batch: false

  n_gpus_per_node: 1

  nnodes: 1

  total_training_steps: 3

  total_epochs: 1

  logger: ["console"]

  save_freq: 1

  test_freq: -1

  val_before_train: false

  resume_mode: auto
