defaults:
  - vision_pruning_experiment
  - _self_

# Formal ChartQA preset: explicit full-parameter student and frozen teacher.
actor_rollout_ref:
  model:
    use_lora: false
    lora_rank: 0
    lora_alpha: 16
    lora_adapter_path: null
    vision_token_pruning:
      keep_ratio: 0.10
      selector: random
      selector_input: vision_embedding
      selector_kwargs: {}
      keep_ratio_schedule: {}
      prefill_keep_ratio: null
      prefill_selector: random
      prefill_prune_after_layer: -1
      prune_after_layer: 0
  actor:
    optim:
      lr: 1.0e-6
    self_distillation:
      teacher_always_on: true
      teacher_model_source: fixed
      teacher_model_path: ${actor_rollout_ref.model.path}
      teacher_image_key: teacher_images
      teacher_prompt_mode: null
      teacher_update_rate: 0.0
      fallback_to_policy_loss_on_missing_teacher: false
